version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cricinsight_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cricops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cricops_secret}
      POSTGRES_DB: ${POSTGRES_DB:-cricinsight}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - cricinsight_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cricops} -d ${POSTGRES_DB:-cricinsight}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cricinsight_pgdata:
